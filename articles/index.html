<!doctype html>
<html lang="no">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="Alle artikler i Snikipedia.">
  <title>Alle artikler – Snikipedia</title>
  <link rel="stylesheet" href="../site.css">
</head>
<body>
<div id="site-header"></div>
<main class="page">
  <div class="backline"><a href="../index.html">← Forsiden</a></div>
  <div class="article">
    <h1>Alle artikler</h1>
    <div class="article-subtitle">Fra Snikipedia, den frie feltencyklopedien</div>
    <p>Søk på tittel, kategori eller stikkord. Alt skjer lokalt i nettleseren.</p>

    <div class="article-index-tools">
      <input id="article-filter" type="search" placeholder="Søk etter f.eks. rype, utstyr, Bang …">
      <span id="article-count" class="article-count"></span>
    </div>

    <div id="empty-state" class="empty-state">
      Ingen artikler funnet. Enten er søket for presist, eller Snikipedia mangler
      fortsatt unødvendig dokumentasjon på området.
    </div>
    <section class="grid" id="article-index"></section>
  </div>
</main>
<div id="site-footer"></div>
<script src="../articles.js"></script>
<script src="../site.js"></script>
</body>
</html>
